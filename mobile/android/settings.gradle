// Force-delete the autolinking cache so it always regenerates with correct
// paths on the build machine. Prevents a Windows-generated
// android/build/generated/autolinking/autolinking.json (absolute C:\\ paths)
// from reaching EAS's Linux builder via EAS build-cache restoration, which
// caused: "No matching variant of project :react-native-*-* ... No variants
// exist" for react-native-async-storage, react-native-safe-area-context and
// react-native-screens. See https://github.com/expo/expo/issues/42370
pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

// Force-delete the autolinking cache so it regenerates with correct paths on
// this build machine. Prevents a Windows-generated
// android/build/generated/autolinking/autolinking.json (absolute Windows
// paths) from reaching EAS's Linux builder via EAS build-cache restoration,
// which caused: "No matching variant of project :react-native-*-* ... No
// variants exist". Must stay AFTER pluginManagement{}/plugins{} (Gradle
// rejects plain statements before them); it still runs before the
// autolinking extensions below resolve any modules.
// See https://github.com/expo/expo/issues/42370
def autolinkingCacheDir = new File(rootDir, "build/generated/autolinking")
if (!System.getProperty("os.name").toLowerCase().contains("windows")) {
  autolinkingCacheDir.deleteDir()
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'SmartHire'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
